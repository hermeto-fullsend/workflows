---
name: Sync upstream
on:
  workflow_call:
    inputs:
      upstream_repo:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_PRIVATE_KEY }}

      - name: Check if sync PR is open
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head sync-upstream-conflict --state open --json number | jq length)
          if [[ $existing -gt 0 ]]; then
            echo "Conflict PR already exists the conflict should be resolved there"
            exit 1
          fi

      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch upstream
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream

      - name: Attempt rebase
        id: rebase_attempt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          default_branch="$(git branch --show-current)"

          if git rebase "upstream/${default_branch}"; then
            echo "rebase=success" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            exit 1
          fi
        continue-on-error: true

      - name: Push rebased branch
        if: steps.rebase_attempt.outputs.rebase == 'success'
        run: |
          default_branch="$(git branch --show-current)"
          git push origin "$default_branch" --force-with-lease

      - name: Rebase open PRs
        if: steps.rebase_attempt.outputs.rebase == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          default_branch="$(git branch --show-current)"

          gh pr list --state open --base "$default_branch" \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | "\(.number) \(.headRefName)"' \
          | while read -r number branch; do
              git fetch origin "$branch"
              git switch -C "$branch" "origin/$branch"

              if git rebase "origin/$default_branch"; then
                git push origin "$branch" --force-with-lease
              else
                git rebase --abort
                gh pr comment "$number" --body "The fork's base branch was rebased onto upstream; please rebase this PR branch manually."
              fi
            done

          git switch "$default_branch"

      - name: Create a PR for conflict resolution
        if: steps.rebase_attempt.outputs.rebase != 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          default_branch="$(git branch --show-current)"
          sync_branch="sync-upstream-conflict"

          git switch -c "$sync_branch"

          if git merge --no-commit "upstream/${default_branch}"; then
            # Merge succeeded cleanly — just commit and push
            git commit -m "Merge upstream/${default_branch}"
          else
            # Merge has conflicts — stage and commit for manual resolution
            git add -u
            git commit -m "Upstream sync attempt with conflicts"
          fi

          git push origin "$sync_branch" --force

          gh pr create \
            --title "Resolve upstream sync conflicts" \
            --body "Automatic sync with upstream encountered conflicts that require manual resolution. Please resolve" \
            --head "$sync_branch" \
            --base "$default_branch"
